<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>3D Surface Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Calque chargé (par le script « Tracker le calque » ou le bouton ↻) -->
  <header>
    <div id="shot" class="shot">
      <div id="shot-empty" class="dim">Aucun calque — lancez « Tracker le calque » sur un calque vidéo.</div>
      <div id="shot-info" class="hidden"></div>
    </div>
    <button id="btn-load" class="tool icon" title="Charger le calque sélectionné dans AE">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
    </button>
  </header>
  <ul id="shot-warnings" class="warnings"></ul>

  <!-- Surface -->
  <section id="s-surface" class="disabled">
    <div class="toolbar" id="toolbar">
      <div class="seg">
        <button data-tool="rect" class="tool icon on" title="Rectangle : 4 coins (arrondissez pour un disque)">
          <svg viewBox="0 0 24 24"><path d="M4 7l15-2 1 12-16 2z"/></svg>
        </button>
        <button data-tool="free" class="tool icon" title="Forme libre : contour d'une zone plane, point par point">
          <svg viewBox="0 0 24 24"><path d="M5 17l2-10 6 3 6-5-1 9-5 4z"/></svg>
        </button>
      </div>
      <label id="round-wrap" class="inline grow" title="Arrondi des coins — à fond : disque">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 19V11a6 6 0 0 1 6-6h8"/></svg>
        <input id="in-round" type="range" min="0" max="100" step="1" value="0">
        <span id="round-val" class="mono">0 %</span>
      </label>
      <button id="btn-flip" class="tool icon hidden" title="Inverser l'inclinaison du disque (flèche bleue)">
        <svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
      </button>
      <span class="grow"></span>
      <button id="btn-clear" class="tool icon" title="Effacer les points">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
    </div>
    <div id="canvas-wrap">
      <canvas id="view"></canvas>
      <div id="live-badge" class="live-badge hidden"></div>
      <div id="canvas-empty">L'image du calque s'affichera ici.</div>
    </div>
    <div id="hint" class="hint"></div>
    <!-- Forme libre : orientation réglable à la main -->
    <div id="orient-wrap" class="orient hidden">
      <label class="inline grow">Inclinaison
        <input id="in-tilt" type="range" min="0" max="80" step="1" value="0"><span id="tilt-val" class="mono">0°</span>
      </label>
      <label class="inline grow">Direction
        <input id="in-dir" type="range" min="0" max="359" step="1" value="0"><span id="dir-val" class="mono">0°</span>
      </label>
      <button id="btn-orient-auto" class="small" title="Laisser le mouvement décider de l'orientation">Auto</button>
    </div>
    <!-- Focale : seulement si la vidéo n'a pas de métadonnées -->
    <div id="focal-wrap" class="focal hidden">
      <span class="warn-text">Focale inconnue</span>
      <input id="in-focal" type="number" min="5" max="1200" step="0.1" placeholder="mm (éq. 24x36)">
      <span class="dim">sinon 50 mm</span>
    </div>
  </section>

  <!-- Tracking + résultat -->
  <section id="s-track" class="disabled">
    <div class="row track-row">
      <button id="btn-track" class="primary">Tracker</button>
      <button id="btn-stop" class="hidden" title="Arrête le suivi et garde les images déjà trackées">■ Arrêter</button>
      <button id="btn-play" class="tool icon" title="Lecture / pause de l'aperçu" disabled>▶</button>
      <div class="scrub-wrap grow">
        <input id="scrub" type="range" min="0" max="0" value="0" disabled>
        <div id="progress" class="hidden"><div id="progress-bar"></div></div>
      </div>
      <span id="frame-label" class="mono">—</span>
    </div>
    <ul id="summary" class="summary"></ul>
    <div id="result-actions" class="row hidden">
      <button id="btn-edit" class="small" title="Revenir aux points de la surface">Retoucher</button>
      <label class="check hidden" id="flip-wrap"><input id="chk-flip" type="checkbox"> Inclinaison inversée</label>
      <span class="grow"></span>
      <button id="btn-apply" class="primary">Appliquer dans AE</button>
    </div>
    <div id="apply-msg" class="info hidden"></div>
    <details id="log-box"><summary>Journal</summary><pre id="log"></pre></details>
  </section>

  <div id="toast" class="hidden"></div>
  <script src="js/main.js"></script>
</body>
</html>
